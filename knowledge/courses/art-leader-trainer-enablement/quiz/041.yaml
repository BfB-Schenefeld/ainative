type: single-choice
stem: "Two assessment gaps can be addressed by one concrete change. How should the group represent that work in the launch plan?"
options:
  - key: "a"
    text: "Create one specific action, link both gaps to it, and name an owner"
    correct: true
    feedback: "Correct. Multiple gaps can be added to one specific action, and each gap and action needs an owner."
  - key: "b"
    text: "Leave both gaps off the plan until the work is complete"
    correct: false
    feedback: "Incorrect. Please review documenting selected assessment gaps in the launch plan in Lesson 6."
  - key: "c"
    text: "Create two vague actions and assign ownership to the whole ART"
    correct: false
    feedback: "Incorrect. Please review specific launch-plan actions and named owners in Lesson 6."
  - key: "d"
    text: "Accept both gaps automatically because they share a cause"
    correct: false
    feedback: "Incorrect. Please review explicit gap decisions and acceptance in Lesson 6."
