stem: "During the confidence check, one participant shows three fingers. What should happen before the plan moves forward?"
options:
  - key: "a"
    text: "The group proceeds because three indicates majority support"
    correct: false
    feedback: "Incorrect. Please review the three-or-below explanation threshold in the fist-of-five check in Lesson 6."
  - key: "b"
    text: "The participant explains the concern, and the group considers it"
    correct: true
    feedback: "Correct. The activity calls for anyone at three or below to explain why before the plan proceeds."
  - key: "c"
    text: "The facilitator removes that person's actions from the plan"
    correct: false
    feedback: "Incorrect. Please review discussing confidence concerns without removing launch-plan actions in Lesson 6."
  - key: "d"
    text: "The participant must raise their rating to five"
    correct: false
    feedback: "Incorrect. Please review explaining low confidence rather than changing a fist-of-five rating in Lesson 6."
