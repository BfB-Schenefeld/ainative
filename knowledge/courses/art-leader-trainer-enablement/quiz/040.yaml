type: single-choice
stem: "Two participants rate the same success-factor statement differently. What should the group do before they adjust their individual assessments?"
options:
  - key: "a"
    text: "Take a majority vote and require everyone to use that rating"
    correct: false
    feedback: "Incorrect. Please review discussing different success factor ratings without forcing agreement in Lesson 5."
  - key: "b"
    text: "Keep the original ratings without discussing them"
    correct: false
    feedback: "Incorrect. Please review comparing interpretations and discussing assessment differences in Lesson 5."
  - key: "c"
    text: "Check whether they understood the statement the same way, then discuss their reasons"
    correct: true
    feedback: "Correct. The group first checks shared understanding, discusses differences, and participants can then reconsider their own evaluations."
  - key: "d"
    text: "Replace the statement with a new success factor"
    correct: false
    feedback: "Incorrect. Please review interpreting existing critical success factor statements in Lesson 5."
