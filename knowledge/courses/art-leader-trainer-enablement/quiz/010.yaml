stem: "Which flow best describes outcome-driven product development?"
options:
  - key: "a"
    text: "Portfolio strategy defines features, ARTs define stories, then teams define metrics after release"
    correct: false
    feedback: "Incorrect. Please review the outcomes-to-priorities flow, measurement, and feedback cycle in Lesson 2."
  - key: "b"
    text: "Outcomes inform priorities and outputs, measurements track progress, and feedback informs learning"
    correct: true
    feedback: "Correct. The cycle connects ART outcomes to PI priorities and outputs, tracks measures, and relates them to customer and business value with feedback."
  - key: "c"
    text: "Annual budgets determine features, which are delivered without revisiting outcomes"
    correct: false
    feedback: "Incorrect. Please review measuring progress and using feedback for learning in Lesson 2."
  - key: "d"
    text: "Customer feedback replaces ART outcomes and PI priorities"
    correct: false
    feedback: "Incorrect. Please review how feedback informs ART outcomes and PI priorities in Lesson 2."
